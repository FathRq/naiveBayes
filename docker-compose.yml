version: '3.8'

services:
  # ==========================================
  # 1. HADOOP HDFS CLUSTER (Apache Hadoop 3.4.3)
  # ==========================================
  namenode:
    image: apache/hadoop:3.4.3
    container_name: namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870" # Web UI NameNode
      - "9000:9000" # Port komunikasi HDFS
    environment:
      - ENSURE_NAMENODE_DIR=/tmp/hadoop-root/dfs/name
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:9000
      - HDFS-SITE.XML_dfs.replication=2
      - HDFS-SITE.XML_dfs.permissions.enabled=false
    volumes:
      - hadoop_namenode:/tmp/hadoop-root/dfs/name
      - ./data:/data # Folder lokal Windows (./data) otomatis terhubung ke /data di container
    networks:
      - bigdata-net

  datanode1:
    image: apache/hadoop:3.4.3
    container_name: datanode1
    hostname: datanode1
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment:
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:9000
      - HDFS-SITE.XML_dfs.replication=2
      - HDFS-SITE.XML_dfs.permissions.enabled=false
    volumes:
      - hadoop_datanode1:/tmp/hadoop-root/dfs/data
    networks:
      - bigdata-net

  datanode2:
    image: apache/hadoop:3.4.3
    container_name: datanode2
    hostname: datanode2
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment:
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:9000
      - HDFS-SITE.XML_dfs.replication=2
      - HDFS-SITE.XML_dfs.permissions.enabled=false
    volumes:
      - hadoop_datanode2:/tmp/hadoop-root/dfs/data
    networks:
      - bigdata-net

  # ==========================================
  # 2. APACHE SPARK CLUSTER (Apache Spark 3.5.6)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080" # Web UI Spark Master
      - "7077:7077" # Port koneksi Spark Master
      - "4040:4040" # Spark Application UI
    volumes:
      - ./scripts:/scripts # Folder lokal (./scripts) otomatis terhubung ke /scripts di container
      - ./data:/data
    networks:
      - bigdata-net

  spark-worker-1:
    image: apache/spark:3.5.6
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
    networks:
      - bigdata-net

  spark-worker-2:
    image: apache/spark:3.5.6
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
    networks:
      - bigdata-net

  # ==========================================
  # 3. NOSQL DATABASE (MongoDB 8 - Opsional)
  # ==========================================
  mongodb:
    image: mongo:8
    container_name: mongodb-uas
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigdata-net

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  mongodb_data:

networks:
  bigdata-net:
    driver: bridge